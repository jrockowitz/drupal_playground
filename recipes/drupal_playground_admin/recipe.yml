name: 'Drupal Playground Admin'
type: 'Site'
description: 'Sets up shared admin modules and configuration.'
install:
  - coffee
  - dashboard
  - environment_indicator
  - help
  - navigation
  - navigation_extra_tools
  - same_page_preview
  - type_tray
  - queue_ui
  - masquerade
config:
  strict: false
  import:
    navigation:
      - system.menu.content
      - system.menu.navigation-user-links
  actions:
    same_page_preview.settings:
      simpleConfigUpdate:
        preview_on_by_default: true
    user.role.content_editor:
      grantPermissions:
        - 'access same_page_preview'

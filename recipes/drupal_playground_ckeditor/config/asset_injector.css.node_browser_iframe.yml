langcode: en
status: true
dependencies:
  module:
    - system
id: node_browser_iframe
label: 'Node Browser iFrame'
code: |-
  div.view-display-id-entity_browser_thumbnails .views-col {
    width: 230px;
    float: left;
    border: 3px solid #ccc;
    margin: 10px 10px 10px 0;
    padding: 10px;
  }

  div.view-display-id-entity_browser_thumbnails .views-col img {
    border: 3px solid #ccc;
    border-radius: 10px;
  }

  div.view-display-id-entity_browser_thumbnails .views-col.selected img {
    border-width: 3px;
  }

  div.view-display-id-entity_browser_thumbnails .views-col .no-image {
    max-width: 95%;
    max-height: 100%;
    text-align: center;
    border: 3px solid #ccc;
    border-radius: 10px;
    background-color: #eee;
    font-weight: bold;
    line-height: 200px;
  }

  div.view-display-id-entity_browser_thumbnails .views-col.selected .no-image {
    border: 3px solid #37802f;
  }

  div.view-display-id-entity_browser_thumbnails .views-field {
    padding: 0 10px;
  }

  div.view-display-id-entity_browser_thumbnails
    .views-field.views-field-field-image {
    min-height: 40px;
  }

  div.view-display-id-entity_browser_thumbnails
    .views-field.views-field-field-image {
    padding: 0;
  }

  div.entity-browser-submit-container {
    z-index: 11;
  }
media: all
preprocess: true
conditions:
  request_path:
    id: request_path
    negate: false
    pages: /entity-browser/iframe/node_browser_iframe
  current_theme:
    id: current_theme
    negate: false
    theme: claro
contexts: {  }
conditions_require_all: true
